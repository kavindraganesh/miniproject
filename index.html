```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Developmental Editor</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f4f7fa;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 700px;
      background: white;
      padding: 35px;
      border-radius: 14px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
    }

    h1 {
      text-align: center;
      margin-bottom: 10px;
      color: #222;
    }

    p {
      text-align: center;
      margin-bottom: 30px;
      color: #666;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      color: #333;
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 14px;
      border: 1px solid #dcdcdc;
      border-radius: 8px;
      font-size: 15px;
      outline: none;
      transition: 0.3s;
    }

    input:focus,
    textarea:focus,
    select:focus {
      border-color: #4a90e2;
    }

    textarea {
      resize: vertical;
      min-height: 120px;
    }

    .upload-box {
      border: 2px dashed #4a90e2;
      padding: 25px;
      text-align: center;
      border-radius: 10px;
      background: #f9fcff;
    }

    .upload-box input {
      border: none;
      margin-top: 10px;
    }

    button {
      width: 100%;
      padding: 15px;
      background: #4a90e2;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      font-weight: bold;
      transition: 0.3s;
    }

    button:hover {
      background: #357bd8;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>AI Manuscript Analyzer</h1>
    <p>Developmental Editing & Manuscript Analysis System</p>

    <form>

      <!-- Login Section -->
      <div class="form-group">
        <label>Full Name</label>
        <input type="text" placeholder="Enter your full name" required>
      </div>

      <div class="form-group">
        <label>Email Address</label>
        <input type="email" placeholder="Enter your email" required>
      </div>

      <div class="form-group">
        <label>Password</label>
        <input type="password" placeholder="Enter your password" required>
      </div>

      <!-- Manuscript Upload -->
      <div class="form-group">
        <label>Upload Manuscript</label>
        <div class="upload-box">
          <p>Upload your manuscript (.doc, .docx, .pdf)</p>
          <input type="file" accept=".doc,.docx,.pdf">
        </div>
      </div>

      <!-- Genre -->
      <div class="form-group">
        <label>Select Genre</label>
        <select required>
          <option value="">Choose Genre</option>
          <option>Fantasy</option>
          <option>Romance</option>
          <option>Thriller</option>
          <option>Mystery</option>
          <option>Historical Fiction</option>
          <option>Young Adult</option>
          <option>Science Fiction</option>
          <option>Horror</option>
          <option>Poetry</option>
          <option>Drama</option>
        </select>
      </div>

      <!-- Character Details -->
      <div class="form-group">
        <label>Main Character Details</label>
        <textarea placeholder="Enter character names, personality, role, emotional arc, conflicts, motivations, etc."></textarea>
      </div>

      <!-- Plot Summary -->
      <div class="form-group">
        <label>Plot Summary</label>
        <textarea placeholder="Briefly explain your story plot, major conflicts, twists, and ending"></textarea>
      </div>

      <!-- Writing Goals -->
      <div class="form-group">
        <label>What do you want AI to analyze?</label>
        <textarea placeholder="Example: plot holes, pacing issues, emotional depth, dialogue weakness, character inconsistency"></textarea>
      </div>

      <button type="submit">Analyze Manuscript</button>

    </form>
  </div>

</body>
</html>
