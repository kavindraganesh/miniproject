<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Developmental Editor</title>

<!-- Font Awesome Icons -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "Segoe UI", sans-serif;
}

body {
    min-height: 100vh;
    background: linear-gradient(135deg, #fde2e4, #e3f2fd, #fff7d6, #f0fff4);
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 30px;
}

.container {
    width: 100%;
    max-width: 950px;
    background: rgba(255,255,255,0.96);
    border-radius: 22px;
    padding: 40px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.08);
}

h1 {
    text-align: center;
    color: #2d2d2d;
    margin-bottom: 10px;
}

h1 i {
    color: #5a8dee;
    margin-right: 8px;
}

.subtitle {
    text-align: center;
    color: #666;
    margin-bottom: 30px;
}

.form-group {
    margin-bottom: 22px;
}

label {
    display: block;
    margin-bottom: 8px;
    font-weight: 600;
    color: #333;
}

input,
textarea,
select {
    width: 100%;
    padding: 14px;
    border: 1px solid #ddd;
    border-radius: 12px;
    font-size: 15px;
}

input:focus,
textarea:focus,
select:focus {
    outline: none;
    border-color: #5a8dee;
}

textarea {
    resize: vertical;
    min-height: 130px;
}

.upload-box {
    border: 2px dashed #5a8dee;
    background: #f7fbff;
    padding: 25px;
    border-radius: 14px;
    text-align: center;
}

.upload-box i {
    font-size: 30px;
    color: #5a8dee;
    margin-bottom: 12px;
}

button {
    width: 100%;
    padding: 16px;
    border: none;
    border-radius: 14px;
    background: linear-gradient(to right, #5a8dee, #7b61ff);
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

.result-box {
    margin-top: 35px;
    padding: 28px;
    border-radius: 16px;
    background: #f8fff8;
    border-left: 6px solid #28a745;
    display: none;
}

.result-box h2 {
    margin-bottom: 18px;
    color: #1f7a34;
}

.section-title {
    margin-top: 18px;
    margin-bottom: 10px;
    font-weight: bold;
    color: #222;
}

ul {
    padding-left: 20px;
}

li {
    margin-bottom: 10px;
    line-height: 1.5;
}
</style>
</head>
<body>

<div class="container">

    <h1><i class="fas fa-book-open"></i>AI Developmental Editor</h1>
    <p class="subtitle">Deep Manuscript Analysis for Authors</p>

    <form id="editorForm">

        <!-- LOGIN -->
        <div class="form-group">
            <label>Author Name</label>
            <input type="text" id="author" required>
        </div>

        <div class="form-group">
            <label>Email</label>
            <input type="email" id="email" required>
        </div>

        <!-- GENRE -->
        <div class="form-group">
            <label>Genre</label>
            <select id="genre" required>
                <option value="">Choose Genre</option>
                <option>Fantasy</option>
                <option>Romance</option>
                <option>Thriller</option>
                <option>Mystery</option>
                <option>Drama</option>
                <option>Poetry</option>
            </select>
        </div>

        <!-- CHARACTER -->
        <div class="form-group">
            <label>Main Character Details</label>
            <textarea id="character"
            placeholder="Example: goal, fear, weakness, internal conflict, emotional arc, motivation..."></textarea>
        </div>

        <!-- PLOT -->
        <div class="form-group">
            <label>Plot Summary</label>
            <textarea id="plot"
            placeholder="Beginning, conflict, midpoint, climax, ending..."></textarea>
        </div>

        <!-- FULL MANUSCRIPT UPLOAD -->
        <div class="form-group">
            <label>Upload Full Manuscript</label>

            <div class="upload-box">
                <i class="fas fa-file-arrow-up"></i>
                <p>Upload your manuscript (.txt for demo)</p>

                <input
                    type="file"
                    id="manuscriptFile"
                    accept=".txt"
                    required
                >
            </div>
        </div>

        <!-- CHAPTER SAMPLE -->
        <div class="form-group">
            <label>Paste Chapter Sample</label>
            <textarea id="chapter"
            placeholder="Paste one chapter or important scene here"></textarea>
        </div>

        <button type="submit">
            Analyze Like a Developmental Editor
        </button>

    </form>

    <!-- RESULT BOX -->
    <div class="result-box" id="resultBox">

        <h2>Developmental Editing Report</h2>

        <div class="section-title">Story Structure</div>
        <ul id="storyResult"></ul>

        <div class="section-title">Character Development</div>
        <ul id="characterResult"></ul>

        <div class="section-title">Genre Expectations</div>
        <ul id="genreResult"></ul>

        <div class="section-title">Reader Engagement</div>
        <ul id="engagementResult"></ul>

    </div>

</div>

<script>
document.getElementById("editorForm").addEventListener("submit", function(e) {
    e.preventDefault();

    const genre = document.getElementById("genre").value.toLowerCase();
    const character = document.getElementById("character").value.toLowerCase();
    const plot = document.getElementById("plot").value.toLowerCase();
    const chapter = document.getElementById("chapter").value.toLowerCase();
    const fileInput = document.getElementById("manuscriptFile");

    let storyFeedback = [];
    let characterFeedback = [];
    let genreFeedback = [];
    let engagementFeedback = [];

    if (!fileInput.files.length) {
        alert("Please upload your manuscript.");
        return;
    }

    const file = fileInput.files[0];
    const reader = new FileReader();

    reader.onload = function(event) {

        const manuscript = event.target.result.toLowerCase();

        /* STORY ANALYSIS */

        if (!plot.includes("conflict")) {
            storyFeedback.push("Your central conflict is unclear. A strong visible problem must drive the plot.");
        }

        if (!plot.includes("climax")) {
            storyFeedback.push("The climax feels weak or undefined. Readers expect a strong emotional or plot peak.");
        }

        if (!plot.includes("ending")) {
            storyFeedback.push("The ending is unclear. Resolution must feel earned and satisfying.");
        }

        if (manuscript.length < 5000) {
            storyFeedback.push("The manuscript appears short for deep structural analysis. Expand emotional beats and scene depth.");
        }

        if (!manuscript.includes("chapter")) {
            storyFeedback.push("Chapter segmentation seems unclear. Distinct chapter progression improves pacing.");
        }

        /* CHARACTER ANALYSIS */

        if (!character.includes("goal")) {
            characterFeedback.push("Your protagonist lacks a strong goal. Desire drives reader investment.");
        }

        if (!character.includes("fear")) {
            characterFeedback.push("Missing emotional vulnerability. Fear makes characters realistic.");
        }

        if (!character.includes("conflict")) {
            characterFeedback.push("Internal conflict is missing. Character tension often matters more than plot tension.");
        }

        if (!character.includes("change")) {
            characterFeedback.push("Character arc feels static. Readers need visible transformation.");
        }

        if (!manuscript.includes("because")) {
            characterFeedback.push("Character motivations feel weak. Cause-and-effect decisions need clarity.");
        }

        /* GENRE ANALYSIS */

        if (genre === "fantasy") {
            genreFeedback.push("Strengthen world-building, kingdom rules, and consequences of magic.");
        }

        if (genre === "romance") {
            genreFeedback.push("Build stronger chemistry, longing, and emotional resistance between leads.");
        }

        if (genre === "thriller") {
            genreFeedback.push("Increase urgency and stakes. Ask what becomes worse if the protagonist fails.");
        }

        if (genre === "mystery") {
            genreFeedback.push("Add layered clues, suspicion, and stronger reveal pacing.");
        }

        if (genre === "drama") {
            genreFeedback.push("Push characters into harder emotional confrontations and moral choices.");
        }

        if (genre === "poetry") {
            genreFeedback.push("Strengthen imagery, metaphor depth, and unforgettable ending lines.");
        }

        /* READER ENGAGEMENT */

        if (chapter.length < 300) {
            engagementFeedback.push("Your chapter sample feels short. Reader immersion needs stronger scene depth.");
        }

        if (!chapter.includes('"') && !chapter.includes("'")) {
            engagementFeedback.push("Dialogue seems limited. Strong dialogue improves pace and emotional attachment.");
        }

        if (!chapter.includes("suddenly")) {
            engagementFeedback.push("Scene momentum feels slow. Add stronger turning points inside scenes.");
        }

        if (
            manuscript.includes("then") &&
            manuscript.includes("after that") &&
            manuscript.includes("suddenly")
        ) {
            engagementFeedback.push("Scene transitions rely too much on progression words. Improve emotional transitions.");
        }

        if (chapter.length > 300) {
            engagementFeedback.push("Strong chapter depth detected. Focus next on sharper pacing and scene transitions.");
        }

        function display(id, data) {
            const target = document.getElementById(id);
            target.innerHTML = "";

            if (data.length === 0) {
                target.innerHTML = "<li>Strong foundation detected in this section.</li>";
            } else {
                data.forEach(item => {
                    const li = document.createElement("li");
                    li.textContent = item;
                    target.appendChild(li);
                });
            }
        }

        display("storyResult", storyFeedback);
        display("characterResult", characterFeedback);
        display("genreResult", genreFeedback);
        display("engagementResult", engagementFeedback);

        document.getElementById("resultBox").style.display = "block";

        document.getElementById("resultBox").scrollIntoView({
            behavior: "smooth"
        });
    };

    reader.readAsText(file);
});
</script>

</body>
</html>
